services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    volumes:
      # Bind-mount the Vite demo source so edits are reflected live.
      - ./metronic-tailwind-react-demos/javascript/vite:/app
      # Keep installed deps out of the bind mount so they persist across restarts.
      - web_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # Vite >= 6.1 appends this to allowedHosts; the platform sets it.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      # Repo-level placeholders so the app boots without credentials.
      - ./.env.base44-defaults
      # Platform-managed secrets (user-supplied) — LAST, always wins.
      - /run/base44/app.env
    ports:
      - "3000:5173"
    command: sh -ec "npm install --force --loglevel=error && exec npx vite --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  web_node_modules:
